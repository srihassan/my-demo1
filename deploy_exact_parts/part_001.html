<!DOCTYPE html>

<html lang="ms">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MASTIC Data Intelligence</title>
<style>
:root {
  --navy:#0B2E63;
  --navy2:#123E76;
  --steel:#24558A;
  --bg:#F4F6F9;
  --panel:#FFFFFF;
  --text:#102A43;
  --muted:#607286;
  --line:#DCE3EC;
  --gold:#C9A34E;
  --green:#287A5A;
  --red:#B4232D;
  --shadow:0 8px 24px rgba(16,42,67,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
body{min-height:100vh}
.shell-header{
  background:linear-gradient(110deg,#071F46 0%,#0B2E63 62%,#123D6B 100%);
  color:#fff;padding:20px 28px 18px;position:sticky;top:0;z-index:100;
  box-shadow:0 8px 24px rgba(7,31,70,.18)
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:20px;max-width:1680px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:44px;height:44px;border-radius:9px;background:#fff;display:grid;grid-template-columns:repeat(4,5px);gap:4px;align-items:end;padding:9px;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.brand-mark i{display:block;background:var(--green);border-radius:2px 2px 0 0}
.brand-mark i:nth-child(1){height:12px} .brand-mark i:nth-child(2){height:20px}
.brand-mark i:nth-child(3){height:27px;background:var(--navy)} .brand-mark i:nth-child(4){height:17px}
.brand-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#D9E4EF}
.brand-title{font-size:21px;font-weight:750;letter-spacing:-.01em;margin-top:2px}
.brand-sub{font-size:11.5px;color:#D5DFEA;margin-top:3px}
.status-chip{font-size:11px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:8px 11px;border-radius:999px;white-space:nowrap}
.header-actions{display:flex;align-items:center;gap:9px}
.lang-toggle{display:flex;gap:2px;padding:3px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:8px}
.lang-toggle button{border:0;background:transparent;color:#DCE6F0;padding:6px 9px;border-radius:5px;cursor:pointer;font-size:10.5px;font-weight:800;letter-spacing:.04em}
.lang-toggle button.active{background:#fff;color:var(--navy)}
.topnav{
  max-width:1680px;margin:15px auto 0;display:flex;gap:4px;overflow-x:auto;padding-bottom:1px
}
.topnav a{
  appearance:none;border:0;background:transparent;color:#D6E1EC;cursor:pointer;
  padding:11px 14px;border-radius:7px;font-weight:650;font-size:12.5px;white-space:nowrap
}
.topnav a:hover{background:rgba(255,255,255,.08);color:#fff}
.topnav a.active{background:#fff;color:var(--navy)}
.main{max-width:1680px;margin:0 auto;padding:22px 24px 38px}
.view{display:none}
.view.active{display:block}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px}
.section-head h1{font-size:22px;margin:0;color:var(--navy)}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.badge.ready{color:var(--green);border-color:#BBDCCA;background:#EAF5EF}
.badge.placeholder{color:#7A5A10;border-color:#EBD9A9;background:#FFF8E8}
.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.module-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px 18px;box-shadow:0 3px 12px rgba(16,42,67,.05);cursor:pointer;transition:.18s}
.module-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.module-card .eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:#71869A;font-weight:700}
.module-card h3{margin:7px 0 5px;font-size:16px;color:var(--navy)}
.module-card p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.module-card .meta{margin-top:14px;display:flex;justify-content:space-between;align-items:center}
.overview-banner{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-bottom:14px}
.hero-card{background:linear-gradient(120deg,#0B2E63,#123E76);color:#fff;border-radius:12px;padding:24px;min-height:165px;position:relative;overflow:hidden}
.hero-card:after{content:"";position:absolute;width:250px;height:250px;border:48px solid rgba(40,122,90,.25);border-radius:50%;right:-85px;top:-110px}
.hero-card h2{margin:0 0 8px;font-size:24px;max-width:760px}
.hero-card p{margin:0;color:#D8E3ED;font-size:13px;line-height:1.6;max-width:760px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px;max-width:620px}
.hero-stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);padding:10px 12px;border-radius:8px}
.hero-stat b{font-size:19px;display:block} .hero-stat span{font-size:10.5px;color:#D8E3ED}
.side-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 3px 12px rgba(16,42,67,.05)}
.side-card h3{font-size:14px;color:var(--navy);margin:0 0 12px}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #EDF1F5;font-size:11.5px}
.status-row:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
.dot.ready{background:var(--green)} .dot.pending{background:var(--gold)}
.placeholder-wrap{display:grid;grid-template-columns:260px 1fr;gap:14px}
.filter-panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 3px 12px rgba(16,42,67,.05);height:max-content}
.filter-panel h3{font-size:13px;margin:0 0 12px;color:var(--navy)}
.fake-filter{margin-bottom:12px}
.fake-filter label{display:block;font-size:10px;color:#6E8194;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.fake-select{border:1px solid #CED8E3;border-radius:7px;background:#F8FAFC;padding:10px 11px;font-size:11px;color:#7A8D9F}
.placeholder-main{display:grid;gap:14px}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px;box-shadow:0 2px 8px rgba(16,42,67,.045);border-top:3px solid #B8C6D6}
.kpi small{font-size:9.5px;color:#72869A;text-transform:uppercase;letter-spacing:.08em}
.kpi strong{display:block;margin-top:8px;font-size:24px;color:#9AA9B7}
.kpi span{font-size:10.5px;color:#8998A8}
.placeholder-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:17px;box-shadow:0 2px 8px rgba(16,42,67,.045)}
.chart-card h3{font-size:13px;color:var(--navy);margin:0 0 5px}
.chart-card p{font-size:10.5px;color:var(--muted);margin:0 0 14px}
.fake-chart{height:260px;border:1px dashed #CCD7E2;border-radius:8px;background:
linear-gradient(to bottom,#fff 0,#fff 19%,#EEF2F6 20%,#fff 21%,#fff 39%,#EEF2F6 40%,#fff 41%,#fff 59%,#EEF2F6 60%,#fff 61%,#fff 79%,#EEF2F6 80%,#fff 81%);
position:relative;overflow:hidden}
.fake-bars{position:absolute;inset:28px 24px 20px 42px;display:flex;gap:10px;align-items:end}
.fake-bars i{flex:1;background:#CBD6E1;border-radius:3px 3px 0 0}
.fake-bars i:nth-child(1){height:35%} .fake-bars i:nth-child(2){height:54%} .fake-bars i:nth-child(3){height:46%} .fake-bars i:nth-child(4){height:68%} .fake-bars i:nth-child(5){height:61%} .fake-bars i:nth-child(6){height:78%}
.placeholder-note{background:#FFF8E8;border:1px solid #EBD9A9;border-left:4px solid var(--gold);padding:12px 14px;border-radius:8px;color:#6B571F;font-size:11.5px;line-height:1.55}
.subnav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:-2px 0 14px;padding-bottom:8px}
.subnav button{border:1px solid var(--line);background:#fff;color:var(--muted);padding:9px 13px;border-radius:7px;cursor:pointer;font-weight:650;font-size:11.5px}
.subnav button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.embed-frame{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 3px 14px rgba(16,42,67,.06)}
.embed-frame iframe{width:100%;height:calc(100vh - 190px);min-height:720px;border:0;display:block;background:#fff}
.skpg-wrap{display:grid;grid-template-columns:1fr 240px;gap:14px}
.skpg-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 3px 14px rgba(16,42,67,.06)}
.skpg-preview img{width:100%;display:block;border-radius:6px}
.actions{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;height:max-content;box-shadow:0 3px 12px rgba(16,42,67,.05)}
.actions h3{margin:0 0 8px;color:var(--navy);font-size:13px}
.actions p{margin:0 0 14px;color:var(--muted);font-size:11.5px;line-height:1.5}
.btn{display:block;text-decoration:none;text-align:center;background:var(--navy);color:#fff;padding:10px 12px;border-radius:7px;font-size:11.5px;font-weight:700}
.btn.secondary{margin-top:8px;background:#EEF3F9;color:var(--navy);border:1px solid #D6E0EA}


.interactive-chart{min-height:310px}.interactive-chart.large{min-height:350px;margin-top:8px}
.chart-legend{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 0;font-size:10px;color:#617487}
.chart-legend span{display:flex;align-items:center;gap:5px}.chart-legend i{width:13px;height:3px;border-radius:4px;display:inline-block}
.subject-explorer{margin-top:14px}.explorer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.explorer-controls{display:grid;grid-template-columns:2fr 2fr 1.2fr;gap:12px;margin:14px 0 8px;padding:12px;background:#F7F9FB;border:1px solid var(--line);border-radius:8px}
.explorer-controls label span{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#6D8093;font-weight:700;margin-bottom:6px}
.explorer-controls select{width:100%;border:1px solid #C9D4DF;border-radius:7px;padding:9px 10px;background:#fff;color:#243B53;font-size:11px}
.explorer-meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.derived-note{margin-top:12px;padding:10px 12px;border-radius:7px;background:#FFF8E8;border:1px solid #EBD9A9;color:#6B571F;font-size:10.5px;line-height:1.5}
.explorer-meta .meta-chip{background:#F6F8FA;border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:10.5px;color:#536A7D}
@media(max-width:850px){.explorer-controls{grid-template-columns:1fr}.interactive-chart{min-height:280px}}

.spm-pane{display:none}.spm-pane.active{display:block}
.spm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.spm-kpi{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px 17px;box-shadow:0 2px 8px rgba(16,42,67,.045);border-top:4px solid var(--navy)}
.spm-kpi small{display:block;font-size:9.5px;color:#6D8093;text-transform:uppercase;letter-spacing:.08em}
.spm-kpi strong{display:block;margin:7px 0 4px;font-size:25px;color:var(--navy)}
.spm-kpi span{font-size:10.5px;color:#6B7D8F}.spm-kpi em{font-style:normal}.spm-kpi .good{color:var(--green);font-weight:700}
.spm-insight-banner{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#EEF3F9;border:1px solid #D6E0EA;border-left:4px solid var(--navy);border-radius:9px;padding:15px 18px;margin-bottom:14px}
.spm-insight-banner.caution{background:#FFF8E8;border-color:#EBD9A9;border-left-color:var(--gold)}
.spm-insight-kicker{display:block;font-size:9px;letter-spacing:.12em;font-weight:800;color:#6D8093;margin-bottom:5px}
.spm-insight-banner strong{font-size:14px;line-height:1.45;color:var(--navy)}.spm-arrow{font-size:25px;color:var(--navy)}
.spm-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.spm-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.spm-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:18px 19px;box-shadow:0 2px 9px rgba(16,42,67,.05)}
.spm-card h3{font-size:13.5px;color:var(--navy);margin:0 0 5px}.spm-card>p{font-size:10.8px;color:var(--muted);line-height:1.5;margin:0 0 10px}
.spm-mini{background:#fff;border:1px solid var(--line);border-radius:9px;padding:15px 16px;border-top:4px solid #B4232D;box-shadow:0 2px 8px rgba(16,42,67,.045)}
.spm-mini span{display:block;font-size:11px;font-weight:700;color:#536A7D}.spm-mini strong{display:block;font-size:25px;color:var(--navy);margin:7px 0 3px}.spm-mini small{font-size:10.5px;color:#718295}
.spm-worse{color:var(--red)!important;font-weight:800}
.spm-table-scroll{overflow-x:auto}.spm-table{width:100%;border-collapse:collapse;font-size:11px}.spm-table th,.spm-table td{padding:9px 10px;border-bottom:1px solid #E7EDF3;text-align:right}.spm-table th:first-child,.spm-table td:first-child{text-align:left}.spm-table th{background:#F5F7FA;color:#52677A;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em}.spm-table tbody tr:hover{background:#F8FAFC}
.story-item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid #EDF1F5}.story-item:last-child{border-bottom:0}.story-item>b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#EEF3F9;color:var(--navy);font-size:11px}.story-item strong{font-size:11.5px;color:#28445E}.story-item p{font-size:10.5px;line-height:1.5;color:#67798B;margin:4px 0 0}
.applied-number{font-size:42px;font-weight:800;color:var(--green);margin:14px 0 4px}.applied-shift{display:flex;align-items:center;gap:10px;background:#F5F8FA;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:12px}.applied-shift span{font-size:20px;color:#75889A}.applied-shift b{color:#98A7B5}.applied-shift strong{font-size:24px;color:var(--green)}.applied-shift em{margin-left:auto;font-style:normal;font-weight:800;color:var(--green)}
.location-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.location-pair>div{background:#F7F9FB;border:1px solid var(--line);border-radius:8px;padding:15px}.location-pair span{font-size:10px;color:#6F8294;text-transform:uppercase;letter-spacing:.06em}.location-pair strong{display:block;font-size:28px;color:var(--navy);margin:5px 0}.location-pair small{font-size:10px;color:#7D8E9F}.location-note{background:#EEF3F9;border-left:4px solid var(--navy);padding:11px 12px;border-radius:7px}
.note-line{display:grid;grid-template-columns:110px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid #EDF1F5}.note-line:last-child{border-bottom:0}.note-line b{color:var(--navy);font-size:11px}.note-line p{margin:0;font-size:11px;color:#5D7082;line-height:1.55}
@media(max-width:1050px){.spm-kpis,.spm-grid4{grid-template-columns:repeat(2,1fr)}.spm-grid2{grid-template-columns:1fr}}
@media(max-width:650px){.spm-kpis,.spm-grid4{grid-template-columns:1fr}.note-line{grid-template-columns:1fr}.location-pair{grid-template-columns:1fr}}


/* ---- SPM Policy Dashboard v3 ---- */

.trend-guidance{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;background:#EEF3F9;border:1px solid #D7E1EA;border-left:4px solid var(--navy);border-radius:9px;padding:14px 16px;margin-bottom:14px}
.trend-guidance-kicker{display:block;font-size:8.8px;letter-spacing:.12em;font-weight:800;color:#6D8093;margin-bottom:4px}
.trend-guidance strong{display:block;font-size:12.5px;color:var(--navy);line-height:1.45}
.trend-guidance p{margin:4px 0 0;font-size:10.4px;color:#617487;line-height:1.5;max-width:900px}
.trend-period>span{display:block;font-size:8.8px;text-transform:uppercase;letter-spacing:.08em;color:#6D8093;font-weight:700;margin-bottom:6px}
.trend-period .seg-row{flex-wrap:nowrap}.trend-period .seg{white-space:nowrap}
.key-signal-card{margin-bottom:14px}
.key-signals-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.signal-card{border:1px solid #E1E8EF;border-radius:8px;padding:12px 13px;background:#FAFBFC}
.signal-card .signal-tag{display:inline-block;font-size:8.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6E8194;margin-bottom:7px}
.signal-card h4{margin:0 0 6px;font-size:11.3px;color:#29445D}
.signal-card p{margin:0;font-size:10.2px;line-height:1.5;color:#5F7386}
.signal-card .signal-number{display:block;font-size:18px;font-weight:800;color:var(--navy);margin:5px 0 3px}
.signal-card .signal-sub{font-size:9.3px;color:#738596}
@media(max-width:1100px){.key-signals-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.trend-guidance{grid-template-columns:1fr}.key-signals-grid{grid-template-columns:1fr}.trend-period .seg-row{flex-wrap:wrap}}

.spm-title-row{align-items:center}.spm-title-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.method-btn{border:1px solid #C9D5E1;background:#fff;color:var(--navy);border-radius:7px;padding:7px 10px;font-size:10.5px;font-weight:700;cursor:pointer}
.method-btn:hover{background:#EEF3F9}
.policy-tabs{overflow-x:auto;flex-wrap:nowrap}.policy-tabs button{white-space:nowrap}
.policy-note{display:flex;gap:7px;align-items:flex-start;background:#EEF3F9;border:1px solid #D7E1EA;border-left:4px solid var(--navy);border-radius:8px;padding:11px 13px;margin-bottom:14px;color:#52677A;font-size:11px;line-height:1.55}
.policy-note strong{color:var(--navy);white-space:nowrap}
.card-head-inline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.direction-chip{font-size:9.5px;font-weight:700;color:#51697D;background:#F1F5F8;border:1px solid #DAE3EB;border-radius:999px;padding:5px 8px;white-space:nowrap}
.policy-chart{min-height:280px}.policy-chart.tall{min-height:320px}
.compact-summary{margin-top:14px}.question-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.question-flow>div{display:flex;gap:9px;align-items:flex-start;background:#F7F9FB;border:1px solid #E2E9F0;border-radius:8px;padding:11px}
.question-flow b{width:22px;height:22px;border-radius:50%;background:#E8EEF5;color:var(--navy);display:grid;place-items:center;font-size:10px;flex:0 0 auto}
.question-flow span{font-size:10.5px;color:#52677A;line-height:1.45}

.subject-profile-card{margin-bottom:14px}.inline-select{display:block;min-width:250px}
.inline-select span,.heatmap-controls label span{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.07em;color:#718396;font-weight:700;margin-bottom:5px}
.inline-select select,.heatmap-controls select{width:100%;border:1px solid #C8D4E0;background:#fff;color:#29445D;border-radius:7px;padding:8px 10px;font-size:10.5px}
.profile-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:14px 0}
.profile-kpi{background:#F8FAFC;border:1px solid #E1E8EF;border-radius:8px;padding:11px 12px;min-width:0}
.profile-kpi span{display:block;font-size:8.8px;text-transform:uppercase;letter-spacing:.055em;color:#75889A}
.profile-kpi strong{display:block;margin-top:5px;font-size:18px;color:var(--navy)}
.profile-kpi small{font-size:9px;color:#708294}.profile-kpi .improve{color:var(--green)}.profile-kpi .weaken{color:#A94A4A}
.profile-charts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini-policy-panel{background:#fff;border:1px solid #E0E7EE;border-radius:8px;padding:13px}
.mini-policy-panel h4{font-size:11px;color:var(--navy);margin:0 0 4px}.mini-policy-panel>p{font-size:9.8px;color:#718295;margin:0 0 8px;line-height:1.4}
.profile-chart{min-height:185px}

.small-multiples{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.small-multiple{border:1px solid #E1E8EF;background:#FAFBFC;border-radius:8px;padding:10px}
.small-multiple .sm-head{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.small-multiple h4{font-size:10.5px;color:#29445D;margin:0}.small-multiple .sm-val{font-size:11px;font-weight:800;color:var(--navy);white-space:nowrap}
